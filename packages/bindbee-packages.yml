findings:
- >-
  github.com/unifyXX is public and holds exactly one repository, react-link. The organization
  publishes no server SDK, no CLI and no examples repository.
- >-
  The Bindbee documentation shows Python, cURL and JavaScript request samples written against the
  raw REST API with `requests` / `fetch`, not against any Bindbee client library — consistent with
  there being no server SDK to show.
- >-
  Gap worth reporting to the provider: the pricing comparison table advertises "SDKs (Node.js,
  Python)" on Lite, Pro and Enterprise, but no such package is discoverable on npm or PyPI.
