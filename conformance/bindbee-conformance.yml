  trust_center: https://trust.bindbee.dev/
  note: >-
    The certifications are named in the pricing FAQ and shown as badges. The trust center itself is
    a hosted portal at trust.bindbee.dev that renders entirely client-side, so the underlying
    reports and their audit periods could not be read by a crawler — the claims above are sourced
    from the pricing page, which is server-rendered.
domain_standard:
  applicable: true
  market: HR / workforce data integration
  candidates_probed:
  - SCIM (urn:ietf:params:scim:schemas:*)
  - HR Open Standards / HR-XML
  - ISO/IEC 30414 human capital reporting
  declared: none
  note: >-
    REWARD-ONLY check, and Bindbee earns nothing here — not because its market lacks a standard,
    but because its contract declares none. This is arguably intrinsic to the unified-API business
    model: the product's value is its own normalization layer across 67+ vendors, and adopting a
    third-party schema would relocate that value. Recorded as an observation, not a defect.
