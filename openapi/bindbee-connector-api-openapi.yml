components:
  schemas:
    Category:
      type: string
      enum:
      - HRIS
      - ATS
      - LMS
      title: Category
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    JobDisplayStatus:
      type: string
      enum:
      - Syncing
      - Done
      - Failed
      title: JobDisplayStatus
    ConnectorResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Id of the connector
          examples:
          - 018b18ef-c487-703c-afd9-0ca478ccd9d6
        is_active:
          type: boolean
          title: Is Active
          description: Flag to indicate if connector is active or not
          examples:
          - true
        status:
          $ref: '#/components/schemas/ConnectorStatus'
          description: Link status of the connector
          examples:
          - COMPLETE
        integration_slug:
          type: string
          title: Integration Slug
          description: Integration slug for the particular connector
          examples:
          - ukg-pro
        end_user:
          type: string
          title: End User
          description: Name of the end user which is used when creating corresponding connector
          examples:
          - Acme Corp.
        origin_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Id
          description: Origin ID of the end user
          examples:
          - user_123
        sync_status:
          anyOf:
          - $ref: '#/components/schemas/JobDisplayStatus'
          - type: 'null'
          description: Latest Sync status of the connector
          examples:
          - Done
        last_sync_start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Sync Start Time
          description: This time represent last sync start time
          examples:
          - '2024-10-16T00:00:00Z'
        next_sync_start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Sync Start Time
          description: This time represent next sync start time
          examples:
          - '2024-10-17T00:00:00Z'
        connector_token:
          type: string
          title: Connector Token
          description: Connector token for this connector
          examples:
          - LJITuCJFqpGXeKfZtn4I9ZcahzA-lkCSO6uhDKj5xw9EzPL96qk7ObgIHQQ1GnxH
        category:
          $ref: '#/components/schemas/Category'
          description: Category of the connector
          examples:
          - HRIS
        relink_needed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Relink Needed At
          description: Time at which credentials were deemed invalid
          examples:
          - '2024-10-17T00:00:00Z'
        is_test_connector:
          type: boolean
          title: Is Test Connector
          description: Flag indicating if connector is test connector or not
          examples:
          - false
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          description: Indicated time at which connector has been linked properly
          examples:
          - '2024-10-17T00:00:00Z'
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Connector creation time
          examples:
          - '2024-10-17T00:00:00Z'
      type: object
      required:
      - id
      - is_active
      - status
      - integration_slug
      - end_user
      - origin_id
      - sync_status
      - last_sync_start_time
      - next_sync_start_time
      - connector_token
      - category
      - relink_needed_at
      - is_test_connector
      - completed_at
      - created_at
      title: ConnectorResponse
    HrisConnectorResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Id of the connector
          examples:
          - 018b18ef-c487-703c-afd9-0ca478ccd9d6
        is_active:
          type: boolean
          title: Is Active
          description: Flag to indicate if connector is active or not
          examples:
          - true
        status:
          $ref: '#/components/schemas/ConnectorStatus'
          description: Link status of the connector
          examples:
          - COMPLETE
        integration_slug:
          type: string
          title: Integration Slug
          description: Integration slug for the particular connector
          examples:
          - ukg-pro
        end_user:
          type: string
          title: End User
          description: Name of the end user which is used when creating corresponding connector
          examples:
          - Acme Corp.
        origin_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Origin Id
          description: Origin ID of the end user
          examples:
          - user_123
        sync_status:
          anyOf:
          - $ref: '#/components/schemas/JobDisplayStatus'
          - type: 'null'
          description: Latest Sync status of the connector
          examples:
          - Done
        last_sync_start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Sync Start Time
          description: This time represent last sync start time
          examples:
          - '2024-10-16T00:00:00Z'
        next_sync_start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Sync Start Time
          description: This time represent next sync start time
          examples:
          - '2024-10-17T00:00:00Z'
        connector_token:
          type: string
          title: Connector Token
          description: Connector token for this connector
          examples:
          - LJITuCJFqpGXeKfZtn4I9ZcahzA-lkCSO6uhDKj5xw9EzPL96qk7ObgIHQQ1GnxH
        category:
          $ref: '#/components/schemas/Category'
          description: Category of the connector
          examples:
          - HRIS
        relink_needed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Relink Needed At
          description: Time at which credentials were deemed invalid
          examples:
          - '2024-10-17T00:00:00Z'
        is_test_connector:
          type: boolean
          title: Is Test Connector
          description: Flag indicating if connector is test connector or not
          examples:
          - false
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          description: Indicated time at which connector has been linked properly
          examples:
          - '2024-10-17T00:00:00Z'
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Connector creation time
          examples:
          - '2024-10-17T00:00:00Z'
        sync_progress:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sync Progress
          description: Progress of the currently running sync as a percentage (0-100). Null when no sync is active or when the sync is pending/failed; use `sync_status` for those states.
          examples:
          - 42
        total_employees:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Employees
          description: Total number of employees synced for this connector. Populated after the first sync completes; null during initial sync.
          examples:
          - 128
        active_employees:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Employees
          description: Number of active employees synced for this connector. Populated after the first sync completes; null during initial sync.
          examples:
          - 120
        avg_sync_duration:
          anyOf:
          - type: string
          - type: 'null'
          title: Avg Sync Duration
          description: Human-readable average sync duration for this connector (e.g. `15 min 30 sec`). null until the first sync completes.
          examples:
          - 15 min 30 sec
