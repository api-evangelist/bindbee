components:
  schemas:
    Category:
      type: string
      enum:
      - HRIS
      - ATS
      - LMS
      title: Category
    CustomFieldUpdateExternal:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 2
          - type: 'null'
          title: Name
          description: Name of the custom field. Must be snake_case.
          examples:
          - guardian_mobile
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the custom field. Send null to clear it.
          examples:
          - Employee's guardian mobile number
        category:
          anyOf:
          - $ref: '#/components/schemas/Category'
          - type: 'null'
          description: Category of the model on which the custom field is created. Cannot be changed once the field has mappings.
          examples:
          - HRIS
        model:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-z][a-z0-9_-]*$
          - type: 'null'
          title: Model
          description: Model on which the custom field is to be applied. Cannot be changed once the field has mappings.
          examples:
          - employee
      type: object
      title: CustomFieldUpdateExternal
    CustomFieldDetailExternal:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique identifier of the custom field.
          examples:
          - 018e586b-7d0b-7bc9-be65-a8fdbc82d734
        name:
          type: string
          title: Name
          description: Name of the custom field (snake_case).
          examples:
          - guardian_mobile
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the custom field.
          examples:
          - Employee's guardian mobile number
        category:
          $ref: '#/components/schemas/Category'
          description: Category of the model.
          examples:
          - HRIS
        model:
          type: string
          title: Model
          description: Model on which the custom field is applied.
          examples:
          - employee
        source:
          $ref: '#/components/schemas/CustomFieldSource'
          description: Origin of the custom field. 'API' if created through the public API, 'DASHBOARD' if created from the Bindbee dashboard.
          examples:
          - API
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        mappings:
          items:
            $ref: '#/components/schemas/CustomFieldMappingExternal'
          type: array
          title: Mappings
          description: All mappings configured for this custom field.
        mapping_counts:
          $ref: '#/components/schemas/CustomFieldMappingCounts'
          description: Counts of mappings for this custom field, broken down by scope.
      type: object
      required:
      - id
      - name
      - category
      - model
      - source
      - created_at
      - mapping_counts
      title: CustomFieldDetailExternal
    CustomFieldMappingCounts:
      properties:
        total:
          type: integer
          title: Total
          description: Total number of mappings configured for this custom field.
          examples:
          - 3
        organization:
          type: integer
          title: Organization
          description: Number of organization-scoped (integration-level) mappings.
          examples:
          - 1
        connector:
          type: integer
          title: Connector
          description: Number of connector-scoped mappings.
          examples:
          - 2
      type: object
      required:
      - total
      - organization
      - connector
      title: CustomFieldMappingCounts
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    EffectiveCustomFieldResponse:
      properties:
        connector_token:
          type: string
          title: Connector Token
          description: Connector the effective view was computed for.
        integration_slug:
          type: string
          title: Integration Slug
          description: Slug of the integration this connector belongs to.
          examples:
          - workday
        category:
          $ref: '#/components/schemas/Category'
          description: Category filter applied.
          examples:
          - HRIS
        model:
          type: string
          title: Model
          description: Model filter applied.
          examples:
          - employee
        fields:
          items:
            $ref: '#/components/schemas/EffectiveCustomFieldEntry'
          type: array
          title: Fields
          description: Every custom field for this org matching (category, model), with the effective mapping per field. Includes unmapped fields so callers can see what is left to configure.
      type: object
      required:
      - connector_token
      - integration_slug
      - category
      - model
      - fields
      title: EffectiveCustomFieldResponse
    PaginatedResponse_CustomFieldExternal_:
      properties:
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
          description: Cursor value to fetch next set of items
          examples:
