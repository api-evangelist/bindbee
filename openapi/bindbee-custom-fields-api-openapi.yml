        page_size:
          type: integer
          title: Page Size
          description: Indicates the count of items in the response
          examples:
          - 50
        items:
          items:
            $ref: '#/components/schemas/CustomFieldExternal'
          type: array
          title: Items
          description: List of items in the current response
      type: object
      required:
      - cursor
      - page_size
      - items
      title: PaginatedResponse[CustomFieldExternal]
    CustomFieldCreateExternal:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 2
          title: Name
          description: Name of the custom field. Must be snake_case.
          examples:
          - guardian_mobile
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the custom field.
          examples:
          - Employee's guardian mobile number
        category:
          $ref: '#/components/schemas/Category'
          description: Category of the model on which the custom field is created.
          examples:
          - HRIS
        model:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_-]*$
          title: Model
          description: Model on which the custom field is to be applied.
          examples:
          - employee
      type: object
      required:
      - name
      - category
      - model
      title: CustomFieldCreateExternal
    CustomFieldMappingExternal:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique identifier of the mapping.
          examples:
          - 018e586b-7d0b-7bc9-be65-a8fdbc82d734
        custom_field_id:
          type: string
          format: uuid
          title: Custom Field Id
          description: ID of the custom field this mapping belongs to.
          examples:
          - 018e586b-7d0b-7bc9-be65-a8fdbc82d734
        integration_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Integration Slug
          description: Integration slug. Set when the mapping is organization-scoped; null otherwise.
          examples:
          - workday
        connector_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Token
          description: Connector token. Set when the mapping is connector-scoped; null otherwise.
          examples:
          - i5kqe8bSedEdPLX9pHhFojKdo7Uzvue0f7I4NVhaDfV0GTxF0uAgwa_COb3zZU3T
        json_path:
          type: string
          title: Json Path
          description: JMESPath expression used to extract the value from the upstream payload.
          examples:
          - data.employee.guardian_mobile
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - id
      - custom_field_id
      - json_path
      - created_at
      title: CustomFieldMappingExternal
    CustomFieldSource:
      type: string
      enum:
      - DASHBOARD
      - API
      title: CustomFieldSource
    CustomFieldMappingCreateExternal:
      properties:
        custom_field_id:
          type: string
          format: uuid
          title: Custom Field Id
          description: ID of the custom field to be mapped.
          examples:
          - 018e586b-7d0b-7bc9-be65-a8fdbc82d734
        integration_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Integration Slug
          description: Integration slug — set this for an organization-scoped mapping (applies to all connectors of this integration in the org). Mutually exclusive with `connector_token`.
          examples:
          - workday
        connector_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Token
          description: Connector token — set this for a connector-scoped mapping (applies to a single connector instance). Mutually exclusive with `integration_slug`.
          examples:
          - i5kqe8bSedEdPLX9pHhFojKdo7Uzvue0f7I4NVhaDfV0GTxF0uAgwa_COb3zZU3T
        json_path:
          type: string
          maxLength: 1024
          title: Json Path
          description: JMESPath expression to extract the value from the upstream payload.
      type: object
      required:
      - custom_field_id
      - json_path
      title: CustomFieldMappingCreateExternal
    EffectiveCustomFieldEntry:
      properties:
        custom_field_id:
          type: string
          format: uuid
          title: Custom Field Id
          description: ID of the custom field.
          examples:
          - 018e586b-7d0b-7bc9-be65-a8fdbc82d734
        name:
          type: string
          title: Name
          description: Name of the custom field.
          examples:
          - guardian_mobile
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the custom field.
        category:
          $ref: '#/components/schemas/Category'
          description: Category of the model.
          examples:
          - HRIS
        model:
          type: string
          title: Model
          description: Model the custom field is applied to.
          examples:
          - employee
        json_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Json Path
          description: The effective JMESPath in use for this field on this connector. Null when no mapping exists.
          examples:
          - data.employee.guardian_mobile
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: 'Which mapping is in effect: ''connector'' (connector-scoped override), ''organization'' (org-scoped inherited), or null (no mapping configured).'
          examples:
          - connector
        mapping_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Mapping Id
          description: ID of the underlying mapping row, for editing. Null when unmapped.
          examples:
          - 018e586b-7d0b-7bc9-be65-a8fdbc82d734
      type: object
      required:
      - custom_field_id
      - name
      - category
      - model
      title: EffectiveCustomFieldEntry
    CustomFieldPreviewResponse:
      properties:
        connector_token:
          type: string
          title: Connector Token
          description: Connector the JMESPath was evaluated against.
          examples:
          - i5kqe8bSedEdPLX9pHhFojKdo7Uzvue0f7I4NVhaDfV0GTxF0uAgwa_COb3zZU3T
        json_path:
          type: string
          title: Json Path
          description: JMESPath expression that was evaluated.
          examples:
          - data.employee.guardian_mobile
        resolved_value:
          anyOf:
          - {}
          - type: 'null'
          title: Resolved Value
          description: The value the JMESPath resolved to. May be of any JSON type or null.
          examples:
          - +1-555-123-4567
        resolved_value_type:
          type: string
          title: Resolved Value Type
          description: 'JSON type of the resolved value: ''string'', ''number'', ''boolean'', ''object'', ''array'', or ''null''.'
          examples:
          - string
        raw_data_source:
          type: string
          title: Raw Data Source
          description: 'Where the evaluated payload came from: ''connector_sync'' (latest synced row), ''integration_sample'' (fallback when never synced), or ''inline'' (provided in the request body).'
          examples:
