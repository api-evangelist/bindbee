      required:
      - connector_token
      - json_path
      - resolved_value_type
      - raw_data_source
      title: CustomFieldPreviewResponse
    CustomFieldPreviewRequest:
      properties:
        connector_token:
          type: string
          title: Connector Token
          description: Connector token to evaluate the JMESPath against.
          examples:
          - i5kqe8bSedEdPLX9pHhFojKdo7Uzvue0f7I4NVhaDfV0GTxF0uAgwa_COb3zZU3T
        category:
          $ref: '#/components/schemas/Category'
          description: Category of the model.
          examples:
          - HRIS
        model:
          type: string
          maxLength: 64
          pattern: ^[a-z][a-z0-9_-]*$
          title: Model
          description: Model slug whose raw payload will be evaluated.
          examples:
          - employee
        json_path:
          type: string
          maxLength: 1024
          title: Json Path
          description: JMESPath expression to evaluate.
          examples:
          - data.employee.guardian_mobile
        raw_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Raw Data
          description: Optional inline payload to evaluate against. If omitted, the connector's latest synced row is used (falling back to the integration sample if never synced).
          examples:
          - null
      type: object
      required:
      - connector_token
      - category
      - model
      - json_path
      title: CustomFieldPreviewRequest
    CustomFieldExternal:
