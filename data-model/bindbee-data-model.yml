observations:
- >-
  The three namespaces do not cross-reference. An HRIS employee and an ATS candidate for the same
  person carry no shared key, and Bindbee declares no link between them — correlating a hire back to
  the candidate who was hired is the consumer's problem.
- >-
  Every relationship above is an embedded reference object or an id field on the parent, not a
  hypermedia link. There are no URLs in the payloads, so an agent must construct follow-up calls
  from path templates it already knows.
- >-
  Write coverage is uneven and asymmetric with read coverage: 109 reads against 35 mutations, and
  entire read namespaces (benefits, compensation, payroll codes, all of LMS) have no write
  counterpart at all.
