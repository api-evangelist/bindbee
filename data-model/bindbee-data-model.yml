description: >-
  The Bindbee unified data model, read out of the provider's own OpenAPI. Three independent
  namespaces — HRIS, ATS and LMS — each rooted on a connector, plus a cross-cutting Custom Fields
  layer that extends any model in any namespace. Relationships below are derived from the reference
  fields actually declared on each schema; nothing is inferred from naming alone.
identity:
  primary_key: id
  format: UUID (UUIDv7-shaped in the provider's own examples)
  upstream_key: remote_id
  upstream_key_note: >-
    Every unified object carries both. `id` is Bindbee's normalized identifier and is stable across
    the Bindbee tenant; `remote_id` is the identifier of the same record in the underlying HR
    system and is the join key back to that vendor. Collection reads accept `remote_id` as a
    filter, which is the supported way to resolve a vendor id to a Bindbee object.
  no_prefixes: >-
    Bindbee does not use type-prefixed identifiers (no "emp_", "cand_"). An id alone does not say
    what it identifies — the caller must track the type.
