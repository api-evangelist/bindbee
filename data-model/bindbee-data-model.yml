  - name: remote_id
    description: The third-party system's identifier for the same record.
  - name: modified_at
    description: When Bindbee last observed a change to this record.
  - name: raw_data
    description: >-
      The untransformed upstream payload. Returned only when include_raw_data=true. This is the
      escape hatch for fields the unified model does not carry.
  - name: custom_fields
    description: >-
      Values for org- or connector-scoped custom fields. Returned only when
      include_custom_fields=true.
