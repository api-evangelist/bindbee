aid: bindbee
name: Bindbee
description: >-
  Bindbee is a unified API for HRIS, Payroll, ATS and LMS integrations. One integration against
  Bindbee reaches 67+ third-party HR systems — BambooHR, Workday, ADP, Greenhouse, Lever, Personio,
  Hibob and the rest — through normalized employee, candidate, job, payroll, time-off and course
  models, so a B2B software company never builds a one-to-one connector again. Each of its
  customers' end users authorizes their own system through an embedded link flow and is addressed
  by a connector token; reads are served from Bindbee's synced copy of the upstream system,
  refreshed every 24 hours by default, with webhooks for sync and data-change events and a
  passthrough endpoint for anything the unified model does not cover.
kind: contract
