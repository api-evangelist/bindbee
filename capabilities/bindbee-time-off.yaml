naftiko: 1.0.0-alpha2
info:
  label: Bindbee API — Time Off
  description: 'Bindbee API — Time Off. 1 operations. Lead operation: Bindbee List Time Off. Self-contained Naftiko capability
    covering one Bindbee business surface.'
  tags:
  - Bindbee
  - Time Off
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BINDBEE_API_KEY: BINDBEE_API_KEY
capability:
  consumes:
  - type: http
    namespace: bindbee-time-off
    baseUri: https://api.bindbee.dev/v1
    description: Bindbee API — Time Off business capability. Self-contained, no shared references.
    resources:
    - name: hris-time-off
      path: /hris/time-off
      operations:
      - name: listtimeoff
        method: GET
        description: Bindbee List Time Off
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: x-connector-token
          in: header
          type: string
          required: true
        - name: employee_id
          in: query
          type: string
          description: Filter by employee ID.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.BINDBEE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: bindbee-time-off-rest
    port: 8080
    description: REST adapter for Bindbee API — Time Off. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/hris/time-off
      name: hris-time-off
      description: REST surface for hris-time-off.
      operations:
      - method: GET
        name: listtimeoff
        description: Bindbee List Time Off
        call: bindbee-time-off.listtimeoff
        with:
          x-connector-token: rest.x-connector-token
          employee_id: rest.employee_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bindbee-time-off-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bindbee API — Time Off. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: bindbee-list-time-off
      description: Bindbee List Time Off
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bindbee-time-off.listtimeoff
      with:
        x-connector-token: tools.x-connector-token
        employee_id: tools.employee_id
      outputParameters:
      - type: object
        mapping: $.
