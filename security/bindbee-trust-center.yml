  note: >-
    A company holding SOC 2 Type II and claiming ISO 27001 has a vulnerability-management process
    by definition; what is missing is a public front door to it. Publishing an RFC 9116
    security.txt naming a Contact and a Policy URL is the smallest possible fix and would make the
    existing program discoverable.
