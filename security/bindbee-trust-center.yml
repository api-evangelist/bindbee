  note: >-
    Bindbee runs a dedicated trust portal on its own subdomain. The page is a Next.js application
    that renders its content entirely client-side (the server response carries only the shell and a
    sites/[slug] route keyed on "trust.bindbee.dev"), so no certification, report or subprocessor
    list could be read from it by a crawler. The certifications below are therefore sourced from
    the server-rendered pricing page, not from the trust center itself.
