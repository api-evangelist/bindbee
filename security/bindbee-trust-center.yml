  security_txt: absent — /.well-known/security.txt returns 404 on all five Bindbee hosts
  bug_bounty: none found on HackerOne, Bugcrowd or Intigriti
  security_contact: >-
    No dedicated security address is published. support@bindbee.dev is the only contact stated in
